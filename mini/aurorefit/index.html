<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>AuroreFit</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --ink:#1a241c; --soft:#6b7a70; --mint:#1aa36a; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { margin:0; font-family:Manrope,system-ui,sans-serif; color:var(--ink); background:linear-gradient(180deg,#ffe9c8 0%,#f3fff4 32%,#f6faf6 100%); min-height:100dvh; padding:calc(8px + env(safe-area-inset-top)) 14px calc(86px + env(safe-area-inset-bottom)); }
    .wrap { max-width:430px; margin:0 auto; }
    .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
    .brand { font-weight:800; font-size:22px; letter-spacing:-.05em; }
    .pill { background:#fff; border-radius:999px; height:30px; padding:0 10px; display:flex; align-items:center; font-size:11px; font-weight:800; color:var(--soft); }
    .glass { background:rgba(255,255,255,.86); backdrop-filter:blur(16px); border:1px solid #fff; border-radius:28px; box-shadow:0 18px 40px rgba(40,60,30,.07); }
    .hero { padding:18px; margin-bottom:12px; }
    .k { font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--soft); }
    .cash { font-size:32px; font-weight:800; letter-spacing:-.05em; margin:4px 0 10px; }
    .goals { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .goal { height:52px; border:0; border-radius:16px; background:#f3f7f3; font:800 13px Manrope; color:var(--ink); }
    .goal.on { background:#1a241c; color:#fff; }
    .ex { display:flex; gap:10px; align-items:center; padding:12px 0; border-bottom:1px solid #eef3ee; }
    .ck { width:22px; height:22px; border-radius:8px; border:2px solid #c9d6cc; flex:none; }
    .ex.done .ck { background:#1aa36a; border-color:#1aa36a; }
    .name { font-weight:800; } .sub { color:var(--soft); font-size:12px; font-weight:700; }
    .donebtn { height:50px; border:0; border-radius:16px; font:800 15px Manrope; width:100%; margin-top:12px; background:#1aa36a; color:#fff; }
    .ask { background:#ff9f3c; color:#2a1600; border:0; border-radius:16px; padding:0 16px; height:48px; font:800 15px Manrope; }
    .chat { display:flex; gap:8px; margin-top:10px; }
    input { flex:1; height:48px; border:0; border-radius:16px; background:#f3f7f3; padding:0 14px; font:600 14px Manrope; outline:none; }
    .bubble { background:#f3fff6; border-radius:18px; padding:12px 14px; line-height:1.45; font-weight:600; }
    .stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
    .stat { background:#f6faf6; border-radius:16px; padding:10px; }
    .stat b { display:block; font-size:16px; }
    .rowx { display:flex; justify-content:space-between; gap:8px; padding:12px 14px; border-bottom:1px solid #eef3ee; }
    .empty { text-align:center; color:var(--soft); padding:28px 16px; font-weight:700; }
    .nav { position:fixed; left:14px; right:14px; bottom:calc(10px + env(safe-area-inset-bottom)); max-width:402px; margin:0 auto; display:grid; grid-template-columns:1fr 1fr; background:#1a241c; border-radius:22px; padding:6px; z-index:20; }
    .nav button { height:46px; border:0; border-radius:16px; background:transparent; color:#9aada0; font:800 13px Manrope; }
    .nav button.on { background:#fff; color:#1a241c; }
    .hidden { display:none !important; }
    .hint { text-align:center; color:#8a9a8e; font-size:11px; margin-top:10px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="coach">
      <div class="top"><div class="brand">AuroreFit</div><div class="pill">Séance du jour</div></div>
      <section class="glass hero"><div class="k">Objectif</div><div class="goals" id="goals"><button class="goal on" data-g="force">Force</button><button class="goal" data-g="cardio">Cardio</button><button class="goal" data-g="mobilite">Mobilité</button><button class="goal" data-g="maison">Maison 20 min</button></div></section>
      <section class="glass hero"><div class="k">Séance</div><div class="cash" id="title" style="font-size:22px;margin-bottom:4px">Force</div><div id="plan"></div><button class="donebtn" id="finish">Valider la séance</button></section>
      <section class="glass hero"><div class="k">Coach</div><div class="bubble" id="reply">Dis-moi si tu es fatigué, pressé, ou si un endroit te fait mal.</div><div class="chat"><input id="q" placeholder="Ex. 15 min, mal au genou…" /><button class="ask" id="ask">OK</button></div></section>
    </div>
    <div id="suivi" class="hidden">
      <div class="top"><div class="brand">Suivi</div><div class="pill">Ton journal</div></div>
      <section class="glass hero"><div class="k">Cette semaine</div><div class="cash" id="weekN">0 séances</div><div class="stats"><div class="stat"><div class="k">Total</div><b id="sTotal">0</b></div><div class="stat"><div class="k">Minutes</div><b id="sMin">0</b></div><div class="stat"><div class="k">kcal ~</div><b id="sKcal">0</b></div></div></section>
      <section class="glass" style="overflow:hidden"><div class="k" style="padding:14px 14px 0">Séances validées</div><div id="hist"></div></section>
    </div>
    <p class="hint">Coach local · pas un avis médical.</p>
  </div>
  <nav class="nav"><button class="on" id="tabC">Coach</button><button id="tabS">Suivi</button></nav>
  <script>
    const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();tg.setHeaderColor("#ffe9c8");tg.setBackgroundColor("#f6faf6");}
    const KEY="aurorefit.suivi.v1";
    const META={force:{label:"Force",min:28,kcal:180},cardio:{label:"Cardio",min:24,kcal:220},mobilite:{label:"Mobilité",min:18,kcal:80},maison:{label:"Maison 20 min",min:20,kcal:140}};
    const PLANS={force:[["Goblet squat","3×8"],["Pompes tempo","3×8"],["Row sac / haltère","3×10"],["Gainage","40 s"]],cardio:[["Marche rapide","5 min"],["Intervalles 1/1","10 min"],["Montées de genoux","4×30 s"],["Retour calme","4 min"]],mobilite:[["Chat-vache","10 resp."],["World’s greatest stretch","6 / côté"],["Hanches 90/90","8 / côté"],["Respiration 4-6","3 min"]],maison:[["Squat chaise","40 s"],["Pompes (genoux ok)","40 s"],["Fentes inversées","40 s"],["Gainage + repos","3 tours"]]};
    let goal="force", checks=[0,0,0,0];
    let state=JSON.parse(localStorage.getItem(KEY)||"null")||{sessions:[]};
    const persist=()=>localStorage.setItem(KEY,JSON.stringify(state));
    const weekStart=()=>{const d=new Date();const day=(d.getDay()+6)%7;d.setHours(0,0,0,0);d.setDate(d.getDate()-day);return +d;};
    function paintPlan(){document.getElementById("title").textContent=META[goal].label+" · "+META[goal].min+" min";document.getElementById("plan").innerHTML=PLANS[goal].map((e,i)=>`<div class="ex ${checks[i]?"done":""}" data-i="${i}"><div class="ck"></div><div><div class="name">${e[0]}</div><div class="sub">${e[1]}</div></div></div>`).join("");}
    function coach(text){const t=text.toLowerCase();if(/genou|cheville|dos|épaule|mal/.test(t))return "On coupe l’impact. Mobilité + unilatéral léger. Tu stoppes si la douleur monte.";if(/fatig|sommeil|crev/.test(t))return "Séance courte : 12 min mobilité + 8 min marche. La récup compte autant que l’effort.";if(/15|20|press|manque de temps|vite/.test(t))return "Circuit maison 20 min : 40 s effort / 20 s pause, 3 tours. Valide ensuite dans Suivi.";if(/course|run|footing/.test(t))return "5 min facile, puis 6×1 min un peu plus vite / 1 min facile.";if(/abdo|core|gainage/.test(t))return "Dead bug 8/côté, side plank 25 s, hollow 20 s. 3 tours.";return "Garde cette séance. Coche les exercices, puis valide pour l’enregistrer dans ton suivi.";}
    function renderSuivi(){const w=weekStart();const week=state.sessions.filter(s=>s.at>=w);const min=state.sessions.reduce((a,s)=>a+s.min,0);const kcal=state.sessions.reduce((a,s)=>a+s.kcal,0);document.getElementById("weekN").textContent=week.length+" séance"+(week.length>1?"s":"");document.getElementById("sTotal").textContent=state.sessions.length;document.getElementById("sMin").textContent=min;document.getElementById("sKcal").textContent=kcal;document.getElementById("hist").innerHTML=state.sessions.length?state.sessions.slice(0,25).map(s=>`<div class="rowx"><div><b>${s.label}</b><div class="sub">${s.when}</div></div><div style="text-align:right;font-weight:800">${s.min} min<div class="sub">${s.kcal} kcal</div></div></div>`).join(""):`<div class="empty">Aucune séance validée.<br>Termine-en une dans Coach.</div>`;}
    function show(id){document.getElementById("coach").classList.toggle("hidden",id!=="coach");document.getElementById("suivi").classList.toggle("hidden",id!=="suivi");document.getElementById("tabC").classList.toggle("on",id==="coach");document.getElementById("tabS").classList.toggle("on",id==="suivi");}
    document.getElementById("goals").onclick=e=>{const b=e.target.closest(".goal");if(!b)return;document.querySelectorAll(".goal").forEach(x=>x.classList.remove("on"));b.classList.add("on");goal=b.dataset.g;checks=[0,0,0,0];paintPlan();};
    document.getElementById("plan").onclick=e=>{const row=e.target.closest(".ex");if(!row)return;const i=+row.dataset.i;checks[i]=checks[i]?0:1;paintPlan();};
    document.getElementById("finish").onclick=()=>{const m=META[goal];const when=new Date().toLocaleString("fr-FR",{weekday:"short",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});state.sessions.unshift({g:goal,label:m.label,min:m.min,kcal:m.kcal,when,at:Date.now()});persist();checks=[0,0,0,0];paintPlan();show("suivi");renderSuivi();if(tg?.HapticFeedback)tg.HapticFeedback.notificationOccurred("success");};
    document.getElementById("ask").onclick=()=>{const v=document.getElementById("q").value.trim();if(!v)return;document.getElementById("reply").textContent=coach(v);if(tg?.HapticFeedback)tg.HapticFeedback.impactOccurred("light");};
    document.getElementById("tabC").onclick=()=>show("coach");
    document.getElementById("tabS").onclick=()=>{show("suivi");renderSuivi();};
    paintPlan();
  </script>
</body>
</html>

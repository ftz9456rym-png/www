<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>ChronoZen</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#06131a; --text:#e8fbff; --muted:rgba(232,251,255,.6); }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; font-family: Outfit, system-ui, sans-serif; color: var(--text);
      min-height: 100dvh;
      background:
        radial-gradient(700px 380px at 50% -8%, #0e5d62 0%, transparent 60%),
        radial-gradient(500px 280px at 100% 100%, #123a6a 0%, transparent 50%),
        var(--bg);
      padding: calc(18px + env(safe-area-inset-top)) 16px calc(22px + env(safe-area-inset-bottom));
    }
    .wrap { max-width: 430px; margin: 0 auto; text-align: center; }
    .badge {
      display: inline-block; padding: 6px 12px; border-radius: 999px;
      background: rgba(46,233,212,.12); border: 1px solid rgba(46,233,212,.28);
      color: #9ff7ec; font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    }
    h1 { margin: 10px 0 6px; font-size: 28px; }
    p.lead { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
    .orb-wrap { perspective: 900px; margin: 8px auto 18px; width: 260px; height: 260px; }
    .orb {
      width: 260px; height: 260px; border-radius: 50%; position: relative;
      background:
        radial-gradient(circle at 35% 28%, rgba(255,255,255,.35), transparent 28%),
        radial-gradient(circle at 50% 50%, #1ad6c4 0%, #0b6f8a 55%, #07253a 100%);
      box-shadow: 0 28px 50px rgba(0,0,0,.45), 0 0 0 10px rgba(255,255,255,.05), inset 0 -18px 30px rgba(0,20,40,.35), inset 0 12px 18px rgba(255,255,255,.16);
      transform: rotateX(12deg);
    }
    .ring { position: absolute; inset: 10px; }
    .time { position: absolute; inset: 0; display: grid; place-items: center; font-size: 54px; font-weight: 700; letter-spacing: -.04em; text-shadow: 0 8px 20px rgba(0,0,0,.35); }
    .modes { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; }
    .chip { border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06); color: var(--text); border-radius: 999px; padding: 8px 14px; cursor: pointer; font: 600 13px Outfit; }
    .chip.on { background: linear-gradient(180deg, #2ee9d4, #1aa7c2); color: #062226; border-color: transparent; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn { height: 52px; border: 0; border-radius: 16px; cursor: pointer; font: 700 16px Outfit; transform: translateY(-3px); }
    .primary { color: #062226; background: linear-gradient(180deg, #b8fff4, #2ee9d4); box-shadow: 0 8px 0 #148f86, 0 14px 24px rgba(46,233,212,.25); }
    .ghost { color: var(--text); background: linear-gradient(180deg, #1b3344, #102230); box-shadow: 0 8px 0 #07131b, 0 14px 20px rgba(0,0,0,.25); border: 1px solid rgba(255,255,255,.12); }
    .btn:active { transform: translateY(0); box-shadow: 0 2px 0 #07131b; }
    .card { margin-top: 16px; text-align: left; padding: 16px; border-radius: 22px; background: linear-gradient(180deg, rgba(255,255,255,.1), rgba(255,255,255,.04)); border: 1px solid rgba(255,255,255,.14); box-shadow: 0 16px 36px rgba(0,0,0,.28); }
    .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .stat { background: rgba(0,0,0,.2); border-radius: 14px; padding: 12px; text-align: center; }
    .stat b { display: block; font-size: 20px; }
    .stat small { color: var(--muted); font-size: 11px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="badge">Mini App · ChronoZen</div>
    <h1>Focus en orbite</h1>
    <p class="lead">Un timer Pomodoro 3D. Respire, lance, termine.</p>
    <div class="orb-wrap">
      <div class="orb">
        <svg class="ring" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="7"/>
          <circle id="progress" cx="60" cy="60" r="52" fill="none" stroke="#fff8c7" stroke-width="7" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="0" transform="rotate(-90 60 60)"/>
        </svg>
        <div class="time" id="time">25:00</div>
      </div>
    </div>
    <div class="modes">
      <button class="chip on" data-sec="1500">Focus 25</button>
      <button class="chip" data-sec="300">Pause 5</button>
      <button class="chip" data-sec="900">Deep 15</button>
    </div>
    <div class="controls">
      <button class="btn primary" id="toggle">Démarrer</button>
      <button class="btn ghost" id="reset">Réinitialiser</button>
    </div>
    <section class="card">
      <div class="stats">
        <div class="stat"><b id="sessions">0</b><small>sessions</small></div>
        <div class="stat"><b id="minutes">0</b><small>minutes</small></div>
        <div class="stat"><b id="state">Prêt</b><small>statut</small></div>
      </div>
    </section>
  </div>
  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor("#06131a"); tg.setBackgroundColor("#06131a"); }
    const KEY = "chronozen.v1";
    const store = JSON.parse(localStorage.getItem(KEY) || '{"sessions":0,"minutes":0}');
    const timeEl = document.getElementById("time");
    const progress = document.getElementById("progress");
    const CIRC = 2 * Math.PI * 52;
    let total = 1500, left = 1500, ticking = false, timer = null;
    function fmt(s) {
      const m = Math.floor(s / 60).toString().padStart(2,"0");
      const r = (s % 60).toString().padStart(2,"0");
      return `${m}:${r}`;
    }
    function paint() {
      timeEl.textContent = fmt(left);
      progress.style.strokeDasharray = CIRC;
      progress.style.strokeDashoffset = CIRC * (1 - left / total);
      document.getElementById("sessions").textContent = store.sessions;
      document.getElementById("minutes").textContent = store.minutes;
      document.getElementById("state").textContent = ticking ? "En cours" : (left === 0 ? "Terminé" : "Prêt");
    }
    function persist() { localStorage.setItem(KEY, JSON.stringify(store)); }
    document.querySelectorAll(".chip").forEach(chip => {
      chip.onclick = () => {
        document.querySelectorAll(".chip").forEach(c => c.classList.remove("on"));
        chip.classList.add("on");
        stop();
        total = left = Number(chip.dataset.sec);
        paint();
      };
    });
    function tick() {
      if (left <= 0) {
        stop();
        store.sessions += 1;
        store.minutes += Math.round(total / 60);
        persist();
        paint();
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
        if (tg?.showPopup) tg.showPopup({ title: "ChronoZen", message: "Session terminée. Belle orbite." });
        return;
      }
      left -= 1;
      paint();
    }
    function start() {
      if (left <= 0) left = total;
      ticking = true;
      document.getElementById("toggle").textContent = "Pause";
      timer = setInterval(tick, 1000);
      paint();
    }
    function stop() {
      ticking = false;
      clearInterval(timer);
      document.getElementById("toggle").textContent = "Démarrer";
      paint();
    }
    document.getElementById("toggle").onclick = () => ticking ? stop() : start();
    document.getElementById("reset").onclick = () => { stop(); left = total; paint(); };
    paint();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Klaro</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { margin:0; font-family:Outfit,system-ui,sans-serif; color:#24304a; min-height:100dvh; background:radial-gradient(800px 340px at 0% 0%, #ffe4d2 0%, transparent 55%), radial-gradient(640px 300px at 100% 0%, #d8e4ff 0%, transparent 50%), #fff8f2; padding:calc(16px + env(safe-area-inset-top)) 16px calc(22px + env(safe-area-inset-bottom)); }
    .wrap { max-width:430px; margin:0 auto; }
    .badge { display:inline-block; padding:6px 12px; border-radius:999px; background:#ffe8d6; color:#9a4b1a; font-size:12px; letter-spacing:.06em; text-transform:uppercase; }
    h1 { margin:10px 0 4px; font-size:28px; }
    .lead { margin:0 0 14px; color:#6b7388; font-size:14px; }
    .hero { background:#fff; border-radius:24px; padding:16px; border:1px solid #f0ddcf; box-shadow:0 16px 0 #f3e0d2; }
    .cash { font-size:34px; font-weight:700; } .mini { color:#6b7388; font-size:13px; }
    .row { display:flex; gap:8px; margin-top:12px; }
    input, select { height:48px; border-radius:14px; border:1px solid #f0ddcf; background:#fffdfb; padding:0 12px; font:500 15px Outfit; color:#24304a; outline:none; }
    input { flex:1; } select { width:118px; }
    .add { height:50px; border:0; border-radius:16px; cursor:pointer; font:700 16px Outfit; color:#3a1c0c; background:linear-gradient(180deg,#ffe0c4,#ff9a4a); box-shadow:0 8px 0 #d56d22; }
    .list { margin-top:14px; display:flex; flex-direction:column; gap:8px; }
    .item { background:#fff; border-radius:16px; padding:12px 14px; display:flex; justify-content:space-between; border:1px solid #f0ddcf; }
    .amt { font-weight:700; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="badge">Mini App · Klaro</div>
    <h1>Dépenses claires</h1>
    <p class="lead">Note un achat en 3 secondes. Total du mois, sans tableau Excel.</p>
    <section class="hero"><div class="mini">Ce mois-ci</div><div class="cash" id="total">0 €</div></section>
    <div class="row"><input id="label" placeholder="Café, métro, courses…" maxlength="40" /><input id="amount" type="number" inputmode="decimal" placeholder="€" style="width:92px" /></div>
    <div class="row"><select id="cat"><option>Food</option><option>Transport</option><option>Maison</option><option>Sortie</option><option>Santé</option><option>Autre</option></select><button class="add" id="add" style="flex:1">Ajouter</button></div>
    <div class="list" id="list"></div>
  </div>
  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor("#fff8f2"); tg.setBackgroundColor("#fff8f2"); }
    const KEY="klaro.v1"; const month = new Date().toISOString().slice(0,7);
    let items = JSON.parse(localStorage.getItem(KEY) || "[]");
    function persist(){ localStorage.setItem(KEY, JSON.stringify(items)); }
    function render(){
      const cur = items.filter(i=>i.m===month);
      const sum = cur.reduce((s,i)=>s+i.a,0);
      document.getElementById("total").textContent = sum.toLocaleString("fr-FR",{minimumFractionDigits:2}) + " €";
      document.getElementById("list").innerHTML = cur.slice().reverse().slice(0,12).map(i=>`<div class="item"><div><strong>${i.l}</strong><div class="mini">${i.c}</div></div><div class="amt">${i.a.toLocaleString("fr-FR",{minimumFractionDigits:2})} €</div></div>`).join("") || `<div class="mini" style="text-align:center;padding:10px">Aucune dépense pour l’instant.</div>`;
    }
    document.getElementById("add").onclick=()=>{
      const l=document.getElementById("label").value.trim(); const a=Number(document.getElementById("amount").value);
      if(!l || !(a>0)) return;
      items.push({ id:Date.now(), l, a, c:document.getElementById("cat").value, m:month });
      document.getElementById("label").value=""; document.getElementById("amount").value=""; persist(); render();
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
    };
    render();
  </script>
</body>
</html>

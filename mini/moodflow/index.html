<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>MoodFlow</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg0: #12081f;
      --bg1: #1d1033;
      --stroke: rgba(255, 255, 255, 0.16);
      --text: #f6f1ff;
      --muted: rgba(246, 241, 255, 0.62);
      --r: 22px;
      --shadow: 0 18px 40px rgba(8, 2, 20, 0.45), inset 0 1px 0 rgba(255,255,255,.18);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Outfit, system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 500px at 10% -10%, #5b2d7a 0%, transparent 55%),
        radial-gradient(900px 420px at 110% 0%, #2a3a8c 0%, transparent 50%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      padding: calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    }
    .wrap { max-width: 430px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 18px; }
    .badge {
      display: inline-flex; gap: 8px; align-items: center;
      padding: 6px 12px; border-radius: 999px;
      background: rgba(255,122,217,.14); border: 1px solid rgba(255,122,217,.28);
      color: #ffc2ec; font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    }
    h1 { margin: 10px 0 6px; font-size: 28px; letter-spacing: -.03em; }
    p.lead { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.05));
      border: 1px solid var(--stroke);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      padding: 16px;
      margin-top: 14px;
    }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
    .mood {
      appearance: none; border: 0; cursor: pointer;
      background: linear-gradient(180deg, #3a2558, #26163c);
      color: var(--text);
      border-radius: 18px;
      min-height: 92px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      box-shadow: 0 10px 0 #160b26, 0 16px 24px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.2);
      transform: translateY(-4px);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .mood:active { transform: translateY(0); box-shadow: 0 2px 0 #160b26, 0 6px 10px rgba(0,0,0,.3); }
    .mood.selected {
      background: linear-gradient(180deg, #6a3dff, #c44dff);
      box-shadow: 0 10px 0 #4a1d8a, 0 16px 28px rgba(140, 60, 220, .4), inset 0 1px 0 rgba(255,255,255,.28);
    }
    .emoji { font-size: 28px; filter: drop-shadow(0 6px 8px rgba(0,0,0,.35)); }
    .mood span { font-size: 12px; font-weight: 600; }
    textarea {
      width: 100%; min-height: 84px; resize: none; margin-top: 12px;
      border-radius: 16px; border: 1px solid var(--stroke);
      background: rgba(8,4,18,.35); color: var(--text);
      padding: 12px 14px; font: 500 15px/1.4 Outfit, sans-serif;
      outline: none;
    }
    .btn {
      width: 100%; margin-top: 12px; border: 0; cursor: pointer;
      height: 52px; border-radius: 16px; font: 700 16px Outfit, sans-serif; color: #1a0824;
      background: linear-gradient(180deg, #ffe1f5, #ff7ad9);
      box-shadow: 0 8px 0 #b44a9a, 0 14px 22px rgba(255,122,217,.28);
      transform: translateY(-3px);
    }
    .btn:active { transform: translateY(0); box-shadow: 0 2px 0 #b44a9a; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat { padding: 14px; border-radius: 16px; background: rgba(0,0,0,.18); border: 1px solid var(--stroke); }
    .stat b { display: block; font-size: 22px; }
    .stat small { color: var(--muted); }
    .list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,.05); }
    .row .left { display: flex; gap: 10px; align-items: center; }
    .hint { color: var(--muted); font-size: 13px; text-align: center; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="badge">Mini App · MoodFlow</div>
      <h1>Comment tu te sens ?</h1>
      <p class="lead">Un geste, une humeur, une note. Ton journal reste sur cet appareil.</p>
    </header>
    <section class="card">
      <div class="grid" id="moods"></div>
      <textarea id="note" placeholder="Un mot sur ta journée…" maxlength="180"></textarea>
      <button class="btn" id="save">Enregistrer l’humeur</button>
    </section>
    <section class="card">
      <div class="stats">
        <div class="stat"><b id="streak">0</b><small>jours d’affilée</small></div>
        <div class="stat"><b id="today">—</b><small>aujourd’hui</small></div>
      </div>
      <div class="list" id="history"></div>
      <p class="hint">Touche une carte 3D pour choisir ton mood.</p>
    </section>
  </div>
  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor("#12081f");
      tg.setBackgroundColor("#12081f");
    }
    const MOODS = [
      { id: "joy", emoji: "😄", label: "Joyeux" },
      { id: "calm", emoji: "😌", label: "Calme" },
      { id: "focus", emoji: "🎯", label: "Focus" },
      { id: "tired", emoji: "😴", label: "Fatigué" },
      { id: "stress", emoji: "😵‍💫", label: "Stressé" },
      { id: "love", emoji: "💗", label: "Aimant" }
    ];
    const moodsEl = document.getElementById("moods");
    let selected = "calm";
    moodsEl.innerHTML = MOODS.map(m => `
      <button class="mood ${m.id === selected ? "selected" : ""}" data-id="${m.id}">
        <div class="emoji">${m.emoji}</div><span>${m.label}</span>
      </button>
    `).join("");
    moodsEl.addEventListener("click", e => {
      const btn = e.target.closest(".mood");
      if (!btn) return;
      selected = btn.dataset.id;
      document.querySelectorAll(".mood").forEach(b => b.classList.toggle("selected", b === btn));
    });
    const KEY = "moodflow.v1";
    const load = () => JSON.parse(localStorage.getItem(KEY) || "[]");
    const saveStore = (data) => localStorage.setItem(KEY, JSON.stringify(data));
    const todayKey = () => new Date().toISOString().slice(0,10);
    function streak(entries) {
      const days = new Set(entries.map(e => e.date));
      let n = 0;
      const d = new Date();
      while (days.has(d.toISOString().slice(0,10))) {
        n++;
        d.setDate(d.getDate() - 1);
      }
      return n;
    }
    function render() {
      const entries = load().sort((a,b) => b.date.localeCompare(a.date));
      const today = entries.find(e => e.date === todayKey());
      const mood = MOODS.find(m => m.id === today?.mood);
      document.getElementById("today").textContent = mood ? `${mood.emoji} ${mood.label}` : "—";
      document.getElementById("streak").textContent = streak(entries);
      document.getElementById("history").innerHTML = entries.slice(0,5).map(e => {
        const m = MOODS.find(x => x.id === e.mood);
        return `<div class="row"><div class="left"><span>${m?.emoji || "•"}</span><div>
          <strong>${m?.label || e.mood}</strong><div style="font-size:12px;color:var(--muted)">${e.date}${e.note ? " · " + e.note : ""}</div>
        </div></div></div>`;
      }).join("") || `<div class="hint">Pas encore d’entrée.</div>`;
    }
    document.getElementById("save").onclick = () => {
      const note = document.getElementById("note").value.trim();
      const entries = load().filter(e => e.date !== todayKey());
      entries.push({ date: todayKey(), mood: selected, note });
      saveStore(entries);
      document.getElementById("note").value = "";
      render();
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    };
    render();
  </script>
</body>
</html>
